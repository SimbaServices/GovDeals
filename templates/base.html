<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GovDeals Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">GovDeals Tracker</a>
    <nav>
      <a href="/">Listings</a>
      <a href="/hooks">Auction hooks</a>
    </nav>
    <div class="actions">
      <form method="post" action="/actions/scrape">
        <button type="submit">Scan now</button>
      </form>
      <form method="post" action="/actions/hooks">
        <button type="submit" class="ghost">Fire due hooks</button>
      </form>
      <a class="button" href="/download/database">Download database</a>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <div id="slideshow" class="slideshow" hidden>
    <button type="button" class="slideshow-backdrop" data-slideshow-close aria-label="Close photos"></button>
    <div class="slideshow-dialog" role="dialog" aria-modal="true" aria-labelledby="slideshow-heading">
      <div class="slideshow-top">
        <h2 id="slideshow-heading" data-slideshow-heading></h2>
        <button type="button" class="slideshow-close" data-slideshow-close>Close</button>
      </div>
      <div class="slideshow-stage">
        <button type="button" class="slideshow-nav" data-slideshow-prev aria-label="Previous photo">‹</button>
        <img data-slideshow-image alt="">
        <button type="button" class="slideshow-nav" data-slideshow-next aria-label="Next photo">›</button>
      </div>
      <p class="slideshow-caption" data-slideshow-caption></p>
    </div>
  </div>
  <script src="/static/slideshow.js"></script>
</body>
</html>
